[project]
name = "ai_research_assistant"
version = "0.1.0"
description = "Market research assistant with a React frontend and CrewAI agents"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.10.1",
    "fastapi==0.135.2",
    "python-dotenv==1.1.1",
    "sqlalchemy==2.0.49",
    "uvicorn==0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
]
