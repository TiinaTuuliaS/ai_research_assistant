research_task:
  description: >
    {quality_rules}
    Aihe: {topic}. Vuosi: {current_year}. Kysymys: {goal}.
    Alue ja asiakkaat: {target_market}. Valinnainen budjetti: {budget}.
    Tutkimustapa: {research_type}. Tehtäväsi: {research_task_deliverable}
    Suunnittele enintään kolme tarkkaa verkkohakua tämän aiheen ja alueen mukaan.
    Käytä eri hakukulmia: aiheeseen suoraan liittyvät paikalliset toimijat ja vaihtoehdot,
    vastaavat konseptit muualla sekä riippumaton asiakas- tai markkinatieto.
    Sovita hakukulmat tutkimustapaan ja toimialaan. Älä rajaa vertailukohteita vain kohdealueeseen.
    Käy hakutulokset läpi ennen havaintojen kirjoittamista. Valitse read_selected_sources-
    työkalulla enintään kolme olennaista sivua eri julkaisijoilta luettavaksi.
    Anna työkalulle purpose (lähteen käyttötarkoitus) ja reason (miksi valitsit sen)
    kielellä {language}. Perustelu tallennetaan lähteen yhteyteen.
    Hakutuloksen sijoitus ei ratkaise valintaa: valitse kysymykseen vastaava alkuperäinen
    lähde myös alempaa listalta. Tarkista muualla toimivan vertailukohteen sijainti ja
    kuvaa se vertailukohtana, älä paikallisena kilpailijana. Älä käytä lukubudjettia
    yleisiin sivuihin, jos tarjolla on aiheeseen suoraan liittyviä tuote- tai palvelusivuja.
    Jos havainnot jäävät yhteen tai kahteen julkaisijaan, käytä jäljellä oleva haku
    puuttuvaan näkökulmaan. Niukka aineisto ei estä vastaamista; kerro kattavuuden raja.
    Etsi ensin ensikäden tarjontatietoja (esimerkiksi ruokalista, hinnasto,
    tuotesivu tai palvelukuvaus), sitten riippumatonta tietoa käyttäytymisestä
    tai markkinasta. Älä tyydy hakemistoon tai somevideoon, jos alkuperäinen lähde
    on löydettävissä. Suuntaa tarvittaessa seuraava haku alkuperäiselle sivustolle.
    Pyri yhdessä trendianalyytikon kanssa löytämään 5–8 hyödyllistä lähdettä,
    mutta älä täytä määrää heikoilla tai toistuvilla linkeillä.
    Suuntaa haut eri nimityksiin ja alueen toimijoiden omiin palvelusivuihin.
    Käytä eri hakukulmia saman hakulauseen toistamisen sijaan. Älä oleta hakua kattavaksi.
    Hakutyökalu palauttaa osasta lähteitä rajatun sivutekstin (page_text).
    Käytä sitä keskeisten hintojen, palvelujen ja sijaintien tarkistamiseen.
    Jos page_status ei ole retrieved, käytössä on vain hakutuloskatkelma. Kerro rajaus.
    Käytä citation_sources-rekisterin source_id-tunnisteita (esimerkiksi S1), älä kirjoita URL-osoitteita uudelleen.
    Älä päättele kysyntää, suosiota tai asiakkaiden kiinnostusta tarjolla olevista
    tuotteista. Kirjaa vain havaittu tarjonta ja mahdolliset suorat käyttäytymistiedot.
    Päätelmät ja suositukset kuuluvat seuraaville agenteille.
    Yksi havainto käsittelee yhtä lähteellä tuettua asiaa ja kohdetta. Älä niputa
    eri yritysten hintoja yhden linkin alle. Tiivistä omin sanoin. Älä kopioi
    lähdekatkelmia raporttiin. Liitä supporting_text-kenttään yksi lyhyt sanatarkka,
    yhtenäinen tukiteksti omasta lähteestä: se jää yksityiseksi tarkistusaineistoksi.
    Tukitekstin tulee tukea koko yhtä havaintoa; erota eri asiat eri havainnoiksi.
    Julkaisupäivä published_at ja hakupäivä retrieved_at ovat lähteen metatietoja,
    eivät havainnon ajankohta. Liitä period_support-kenttään ajanjaksoa osoittava
    sanatarkka tekstikohta. Jos ajanjakso ei selviä, period ja period_support ovat tyhjiä.
    Älä muuta vanhaa lukua nykyvuoden luvuksi tai käytä sivun arkistovalikon vuosia.
    Valitse käyttäjän päätökselle olennaiset tiedot, älä sivujen irrallisia yksityiskohtia.
  expected_output: >
    {research_task_deliverable}
    Palauta ResearchResult-rakenne: topic on tutkimusaihe ja findings on havaintolista.
    Jokaisella havainnolla on title (selkeä otsikko), summary (mitä lähde kertoo ja
    olennainen epävarmuus), source (rekisterin source_id, esimerkiksi S1), supporting_text,
    period_support ja relevance
    (kokonaisluku 1–10: osuvuus kysymykseen, ei luotettavuus tai kysynnän vahvuus).
    Lisää evidence_kind (offering, price, usage, purchase, interest, marketing_claim tai other),
    entity (lähteen osoittama yritys, toimipiste tai ihmisryhmä), area (lähteen osoittama
    alue), period (havainnon ajankohta, ei hakupäivä) ja limitations (1–5 lyhyttä rajausta).
    Käytä tyhjää merkkijonoa, jos kohde, alue tai ajankohta ei selviä. Ketjun alue ei ole
    automaattisesti paikallisen toimipisteen alue. Tarjonta on offering, ei interest
    tai usage. Yrityksen lupaus ainutlaatuisuudesta on marketing_claim.
    Kirjoita tekstikentät kielellä {language}. Tämä rakenne korvaa tehtävän ehdottamat
    tekstiotsikot: älä palauta vapaamuotoista raporttia tai erillistä lähdeluetteloa.
    Jos sopivia havaintoja ei löydy, palauta tyhjä findings-lista, älä keksi sisältöä.
trend_task:
  description: >
    {quality_rules}
    Aihe: {topic}. Vuosi: {current_year}. Kysymys: {goal}.
    Alue ja asiakkaat: {target_market}. Tehtäväsi: {trend_task_deliverable}
    Käytä enintään kolme uutta verkkohakua aiempien havaintojen tarkistamiseen,
    alkuperäisten lähteiden löytämiseen ja vertailukelpoisiin ajallisiin havaintoihin.
    Tee vähintään yksi kansainvälinen haku aiheelle sopivalla kielellä.
    Täydennä tutkijan lähdepohjaa uusilla olennaisilla julkaisijoilla. Valitse
    read_selected_sources-työkalulla luettavaksi kysymykseen vastaavat alkuperäiset
    sivut jäljellä olevan lukubudjetin puitteissa. Älä vain toista tutkijan kahta lähdettä.
    Anna työkalulle purpose ja reason kielellä {language}: mitä näkökulmaa lähde täydentää
    ja miksi se on aiheelle olennainen. Valitse eri tarkoituksiin käytetyt lähteet erikseen.
    Erota markkinaennuste toteutuneesta kehityksestä ja tarkista ennusteen rajaus.
    Älä rajaa
    hakua vain Suomeen tai käyttäjän kaupunkiin. Valitse enintään kolme olennaista
    havaintoa: todennettu kehityssuunta, yksittäinen konseptiesimerkki tai ennuste.
    Kerro maa tai alue, ajankohta ja miksi havainto on käyttäjälle merkityksellinen.
    Arvioi paikallisen soveltamisen edellytys ja rajoite. Ulkomainen menestys ei
    osoita paikallista kysyntää. Kysyntätutkimuksessa painota asiakaskäyttäytymistä,
    kilpailijavertailussa uusia palvelumalleja ja markkinakatsauksessa alan kehitystä.
    Älä keksi menneisyyttä: tämänhetkinen hakemisto ei kerro aiempien vuosien tilanteesta.
    Julkaisuvuosi ei yksin osoita muutosta. Etsi myös vastakkaista näyttöä,
    mutta älä päättele sen puuttumisesta, että alkuperäinen väite on oikea.
    Kerro nimenomaisesti, jos kasvua tai kehityssuuntaa ei voida aineistolla arvioida.
    Säilytä alkuperäisten havaintojen alue- ja aikarajaukset. Viittaa aiempaan havaintoon sen
    lähdetunnisteella; uusille havainnoille anna source_id ja omin sanoin kirjoitettu
    havainto. Yksi havainto käsittelee yhtä lähteellä tuettua asiaa. Liitä yksityiseen
    supporting_text-kenttään yksi lyhyt sanatarkka tukiteksti omasta lähteestä ja
    period_support-kenttään ajanjakson osoittava tekstikohta. Älä kopioi näitä summaryyn.
    Julkaisupäivä published_at ja hakupäivä retrieved_at eivät ole havainnon period.
    Jos period ei selviä lähdetekstistä, jätä se ja period_support tyhjäksi.
  expected_output: >
    {trend_task_deliverable}
    Palauta TrendResult: topic ja enintään kolme findings-havaintoa. Kirjoita kielellä {language}.
    Jokainen havainto sisältää title, summary, source (rekisterin source_id, esimerkiksi S1),
    supporting_text, period_support, relevance (1–10),
    evidence_kind (offering, price, usage, purchase, interest, marketing_claim tai other),
    entity, area, period ja limitations (1–5 rajausta). Tuntematon entity, area tai period on tyhjä merkkijono.
    Lisää trend_kind: observed_change vain ajoitetulle vertailulle, forecast ennusteelle,
    example yksittäiselle esimerkille. Lisää local_relevance: merkitys kohdemarkkinalle ja
    soveltamisen rajoite. Ennusteen kasvuluku ei ole toteutunutta kasvua. Säilytä lähteen alue
    ja ennustejakso; älä muuta maailmanlaajuista ennustetta Euroopan tai Suomen kasvuksi.
    Tämä rakenne korvaa tekstiotsikot. Jos havaintoja ei voida perustella, findings on tyhjä lista.
analysis_task:
  description: >
    {quality_rules}
    Aihe: {topic}. Kysymys: {goal}. Alue ja asiakkaat: {target_market}.
    Tehtäväsi: {analysis_task_deliverable}
    Tarkista erityisesti aiempien agenttien päättelyvirheet. Toisen agentin
    vakuuttava sanavalinta ei vahvista väitettä. Jos lähde ei osoita väitettä,
    kirjoita sen tilalle aineiston sallima johtopäätös. Älä julkaise aiempien agenttien
    virheitä tai sisäistä tarkistuslistaa omana osionaan.
    Hinnasto ei osoita toteutunutta myyntiä, hakemisto ei todista tarjonnan
    puuttumista, avausuutinen ei osoita kysynnän kasvua eikä kilpailijoiden määrä
    yksin todista markkinan kyllästymistä. Älä merkitse tällaisia väitteitä tuetuiksi.
    Kohdista jokainen keskeinen päätelmä alkuperäiseen havaintoon tai trendivaiheen
    lähteistettyyn tekstikohtaan. Nimeä, mitä se osoittaa ja mitä ei: tarjonta,
    pyyntihinta, käyttö, ostot ja kiinnostus eivät ole sama asia. Säilytä tuntemattomat
    alueet ja ajankohdat tuntemattomina. Älä päättele niitä käyttäjän kysymyksestä.
    Kun käytät trendihavaintoa, säilytä trend_kind, area, period ja lähdelinkki:
    ennuste ei muutu toteutuneeksi kasvuksi eikä ulkomainen havainto paikalliseksi.
    Punnitse vahvimmat puoltavat ja vastaan puhuvat havainnot sekä vaihtoehtoiset
    selitykset. Muodosta oma perusteltu tulkinta niiden merkityksestä päätökselle.
    Älä kirjoita sisäistä virhelistaa tai toista muiden tekstiä. Puutteellinen näyttö
    ei ole kielteistä näyttöä. Kerro silti, mitä sen varassa kannattaa tai ei kannata päättää.
  expected_output: >
    {analysis_task_deliverable}
    Kirjoita kielellä {language} noin 150–250 sanaa. Käytä tehtävän selkeitä
    otsikoita. Viittaa väitteiden vieressä lähdetunnisteilla [S1], [S2] jne.
    Ohjelma muodostaa linkit: älä kirjoita URL-osoitteita tai muuta tunnisteita.
    Erottele havainto, oma päätelmä ja puuttuva tieto tavallisella kielellä.
strategy_task:
  description: >
    {quality_rules}
    Aihe: {topic}. Kysymys: {goal}. Alue ja asiakkaat: {target_market}.
    Budjetti: {budget}. Tehtäväsi: {strategy_task_deliverable}
    Perusta ehdotuksesi analyytikon hyväksymiin havaintoihin ja epävarmuuksiin.
    Älä palauta hylättyjä väitteitä perusteluiksi. Suositus ei ole lähteestä
    saatu tosiasia. Älä keksi lukuja, nimeä yritykselle tai uutta asiakastarvetta.
    Anna enintään kaksi lyhyttä seuraavaa askelta, älä haastattelurunkoa tai
    pitkää tutkimussuunnitelmaa. Käyttäjä tarvitsee apua päätökseen, ei uutta tehtävälistaa.
    Kerro jokaisen ehdotuksen yhteydessä alkuperäinen havainto ja lähde.
    Kilpailijavertailussa kerro myös nimetty vertailukohta, konkreettinen ehdotettu ero ja sen tila: osoitettu ero,
    yhteinen ominaisuus tai testattava ehdotus. Jos kilpailija tarjoaa jo samaa,
    ominaisuus ei yksin erotu siitä. Asiakashyöty on oletus, ellei siitä ole näyttöä.
    Älä pakota kilpailijavertailua pelkkään markkinan tilannekuvaan: silloin vertaa
    vaihtoehtoa nykytilanteeseen. Puuttuva tieto ei kelpaa eron perusteluksi.
    Valitse yksi suositeltava etenemissuunta ja vertaa sitä yhteen vaihtoehtoon.
    Se voi olla jatkaminen, muuttaminen, rajattu kokeilu, lykkääminen tai pelkkä
    seuranta käyttäjän kysymyksen mukaan. Älä ehdota pilottia automaattisesti.
    Perustele suositus juuri tämän tutkimuksen havainnoilla ja tärkeimmällä haittapuolella.
  expected_output: >
    {strategy_task_deliverable}
    Kirjoita kielellä {language} noin 100–180 sanaa. Selkeä ehdotus, sen peruste
    ja tärkein epävarmuus. Sovita sanat ja toiminta käyttäjän toimialaan.
    Käytä perustelun vieressä alkuperäistä lähdetunnistetta [S1] ja säilytä trendin alue- ja aikarajaus.
    Ohjelma muodostaa linkit: älä kirjoita URL-osoitteita uudelleen.
report_task:
  description: >
    {quality_rules}
    Aihe: {topic}. Kysymys: {goal}. Alue ja asiakkaat: {target_market}.
    Tehtäväsi: {report_task_deliverable}
    Kirjoita yksi ymmärrettävä vastaus. Aloita 2–3 virkkeen johtopäätöksellä.
    Vastaa suoraan käyttäjän kysymykseen: puoltaako aineisto ajatusta, puhuuko sitä
    vastaan vai onko päätelmä ehdollinen? Valitse näytön mukainen kanta, älä väkisin
    myönteistä tai kielteistä. Ehdollinenkin kanta kertoo, mikä päätös on nyt perusteltu.
    Sano mikä havainto voisi muuttaa arviota. Pelkkä "tarvitaan lisätutkimusta" ei riitä.
    Kirjoita omin sanoin. Lähdekatkelmat, F-tunnisteet ja tarkistuksen hylkäyslistat
    eivät kuulu loppuraporttiin. Kansainväliset havainnot ovat vertailuja, eivät paikallisia tosiasioita.
    Valitse olennaiset havainnot, perustele niiden merkitys ja säilytä epävarmuudet.
    Älä kopioi agenttien tekstejä peräkkäin tai lisää uusia faktaväitteitä.
    Poista analyytikon hylkäämät päätelmät. Älä korvaa niitä uusilla oletuksilla.
    Tarkista aloitusvastaus ja jokainen keskeinen johtopäätös alkuperäisistä
    havainnoista tai uuden lähteen tekstikohdasta, ei pelkästään agenttien
    yhteenvedoista. Säilytä tiedon tyyppi, alue, ajankohta ja rajaukset.
    Kun käytät trendin väitettä tai lukua, liitä sama tarkka lähdelinkki väitteen viereen.
    Säilytä ero ennusteen, havaitun muutoksen ja yksittäisen esimerkin välillä.
    Poista perusteeton varmuus itse lauseesta. Lopun varoitus ei korjaa väärää
    väitettä. Käytä lähdetunnisteita [S1], [S2] jne. Ohjelma muodostaa niistä linkit.
    Viittaa vähintään kahteen eri haussa löytyneeseen lähteeseen tekstissä
    rekisterin lähdetunnisteilla [S1], [S2] jne. Älä kirjoita URL-osoitteita uudelleen.
    Pyri 5–8 käyttökelpoiseen lähteeseen vain, jos
    sellaisia todella löytyi. Älä esitä lähteiden määrää luotettavuuden takeena.
    Sisällytä osio '## Näytön vahvuus ja puutteet' (englanniksi
    '## Evidence strength and gaps'). Kerro, mikä havainto vastaa kysymykseen,
    mikä on vain vertailuesimerkki ja mikä jäi selvittämättä.
    Päätä osioon '## Lähteet' (englanniksi '## Sources'). Anna kullekin lähteelle
    yksi lyhyt selite sen todellisesta käyttötarkoituksesta ja olennaisesta rajasta.
    Kerro kartoituksen rajat. Löydetyt toimijat eivät ole markkinan kokonaismäärä.
    Erota rajatut sivutekstit (page_status: retrieved) pelkistä hakutuloskatkelmista.
    Älä väitä kaikkia lähdesivuja luetuiksi tai toimijan puuttuvan alueelta.
    Tarkista lopuksi jokainen otsikko ja virke: ymmärtääkö tavallinen lukija sen
    ilman agenttityön tai liiketoimintasanaston tuntemista? Kirjoita epäselvä kohta uudelleen.
    Puhuttele käyttäjää luontevasti: esimerkiksi "ideasi", "palvelusi" tai
    "suunnittelemasi ravintola" aiheen mukaan, ei "käyttäjän ratkaisu".
    Käytä tavallisia sanoja, kuten "kilpailutilanne" ilmauksen "kilpailun dynamiikka" sijaan.
  expected_output: >
    {report_task_deliverable}
    Kielellä {language} kirjoitettu 300–500 sanan loppuraportti lähteiden lisäksi.
    Selkeät otsikot, konkreettiset havainnot ja niiden merkitys käyttäjälle.
    Vähintään kaksi tekstin lähdelinkkiä ja lopussa lähdeluettelo. Jos aineisto
    on niukka, lyhyempi rehellinen raportti on parempi kuin sanamäärän täyttäminen.
