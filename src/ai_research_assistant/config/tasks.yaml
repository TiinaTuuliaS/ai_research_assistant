research_task:
  description: >
    {quality_rules}
    Aihe: {topic}. Nykyinen vuosi: {current_year}.
    Käyttäjän vahvistamaton lähtökuvaus: {goal}.
    Alue ja asiakkaat: {target_market}. Budjetti: {budget}.
    Tutkimustapa: {research_type}. Tehtäväsi: {research_task_deliverable}
    Etsi kysymykseen vastaavaa aineistoa enintään kuudella haulla.
    Suosi alkuperäisiä palvelu- ja hinnastosivuja sekä riippumatonta tutkimustietoa.
    Lue read_selected_sources-työkalulla enintään kuusi olennaista sivua.
    Anna valinnalle purpose ja reason kielellä {language}.
    Hae ulkomaisia esimerkkejä tai ajallisia muutoksia vain, jos ne auttavat
    vastaamaan kysymykseen. Lähteille ei ole tavoitemäärää.
    Kirjaa yksi rajattu asia yhdestä lähteestä yhdeksi havainnoksi.
    Tukitekstin on tuettava koko havaintoa; älä lainaa tietoa muilta sivuilta.
    Säilytä hinnan palvelumalli, yksikkö, vuokrajakso, provisio ja muut ehdot.
    Yrityksen oma laatulupaus on markkinointiväite, ei riippumaton arvio.
    Lue tukilauseen asiayhteys: tulevaisuusvisio on forecast, vaikka se olisi
    kirjoitettu menneessä aikamuodossa. Asiakaskokemus kertoo yhden asiakkaan
    kokemuksesta, ei palvelun yleisestä laadusta. Säilytä väitteen esittäjä.
    Jos page_status ei ole retrieved, käytössä on vain hakukatkelma.
    Julkaisu- ja hakupäivä eivät ole havainnon ajankohta.
    Älä tee päätelmiä, vertailuetuja tai suosituksia. Ne kuuluvat analyytikolle.
  expected_output: >
    {research_task_deliverable}
    Palauta ResearchResult kielellä {language}: topic ja findings.
    Havainto sisältää title, summary, source (rekisterin S-tunniste),
    supporting_text (lyhyt sanatarkka yhtenäinen tukikohta omasta lähteestä),
    period_support (ajanjakson sanatarkka tuki tai tyhjä), relevance (1–10,
    osuvuus kysymykseen), evidence_kind, trend_kind, entity, area, period,
    local_relevance ja limitations. Tuntematon entity, area tai period on tyhjä.
    Käytä rakenteen sallimia tietotyyppejä. supporting_text jää yksityiseksi.
    Jos sopivaa tietoa ei löydy, findings saa olla tyhjä.
analysis_task:
  description: >
    {quality_rules}
    Aihe: {topic}. Käyttäjän vahvistamaton lähtökuvaus: {goal}.
    Alue ja asiakkaat: {target_market}.
    Tehtäväsi: {analysis_task_deliverable}
    Muodosta päätelmät vain kontekstin hyväksytyistä havainnoista.
    question_fit erottaa suoraan kysymykseen vastaavat havainnot (direct)
    taustatiedosta (background). Taustatieto ei ratkaise kysymystä; unassessed
    tarkoittaa tarkistamatonta osuvuutta. Kerro coverage-kentän osoittama puute.
    source_context säilyttää lähteen tiedon luonteen: visio, lupaus ja
    yksittäinen asiakaskokemus eivät muutu todennetuksi nykytilaksi.
    Käyttäjän suunnitelma ei ole todennettu markkinatieto eikä lähteissä nimetty yritys.
    Liitä jokaiseen päätelmään sitä tukevat finding_ids ja olennainen epävarmuus.
    Hintavertailu vaatii samat palvelut, yksiköt ja ehdot; muuten kuvaa hinnat erikseen.
    Tarjonta ei osoita kysyntää. Yksittäinen esimerkki ei osoita markkinan kasvua.
    Osoitettu ero vaatii vertailutietoa molemmista osapuolista.
    Pelkkä kilpailijan ominaisuus ei ole ero käyttäjän määrittelemättömään suunnitelmaan.
    Jos vertailutietoa ei ole, käytä unknown; älä päättele puuttumista.
    Päätelmän vuosien pitää löytyä sen omista tukiteksteistä.
    Suositus saa olla ehdollinen. Jos aineisto ei oikeuta valintaan, kerro mikä
    ratkaiseva tieto puuttuu; älä keksi strategiaa tai asiakashyötyä täyttääksesi rakenteen.
  expected_output: >
    {analysis_task_deliverable}
    Palauta AnalysisResult kielellä {language}. topic täsmälleen: {topic}.
    research_type: {research_type}. answer vastaa kysymykseen; conclusions
    sisältää vain tarpeelliset päätelmät. statement on tulkinta, finding_ids
    viittaa hyväksyttyihin havaintoihin ja uncertainty kertoo rajat.
    recommendation ja alternative kuvaavat toimintavaihtoehtoja tai miksi
    valintaa ei voi vielä tehdä. gaps nimeää ratkaisevat puuttuvat tiedot.
    Vain kilpailijavertailussa comparisons sisältää competitor_id-tunnisteen
    hyväksyttyjen havaintojen entity_id-kentästä (E1 jne.), feature, finding_ids,
    limitation ja status. Ohjelma ratkaisee yrityksen nimen tunnisteesta.
    Jos toimijan tunniste on tyhjä, jätä yritysvertailu pois ja kirjaa puute.
    status on:
    shared (vertailussa osoitettu yhteinen ominaisuus), evidenced_difference
    (molemmista osapuolista tuettu ero), proposal (testattava ehdotus) tai
    unknown (vertailuasema selvittämättä). Listat saavat jäädä tyhjiksi.
report_task:
  description: >
    {quality_rules}
    Aihe: {topic}. Käyttäjän vahvistamaton lähtökuvaus: {goal}.
    Alue ja asiakkaat: {target_market}.
    Tehtäväsi: {report_task_deliverable}
    Toimitat analyytikon päätelmät luettavaksi raportiksi; et tee uutta analyysiä.
    Käytä havaintoja vain päätelmien lähdetuen ja ehtojen säilyttämiseen.
    Aloita suoralla vastauksella ja kerro perustelut sekä ratkaiseva epävarmuus.
    Säilytä analyysin kanta ja ehdollisuus. Älä lisää faktoja, vertailuetuja,
    suosituksia tai oletuksia asiakkaiden käyttäytymisestä.
    Jos päätelmä ylittää viitatut havainnot, jätä se pois ja kerro tiedon puute.
    Älä täydennä sitä omalla selityksellä. Osoitettu ero vaatii molemminpuolisen tuen.
    Säilytä lukujen mittari, kohde, ajankohta ja ehdot itse väitteen yhteydessä.
    Liitä väitteen viereen juuri sitä tukevan havainnon alkuperäinen [Snumero]
    tai lähdelinkki. Älä sekoita havainto- ja lähdetunnisteita.
    Käytä tekstiviitteeseen havainnon source_id-kenttää, älä finding_id-kenttää.
    Kirjoita tavalliselle lukijalle kielellä {language}. Havaintotunnisteet ja
    tukitekstit jäävät sisäisiksi; S-lähdeviitteet kuuluvat raporttiin.
    Käytä osioita '## Näytön vahvuus ja puutteet'
    ja '## Lähteet' (englanniksi '## Evidence strength and gaps' ja '## Sources').
    Kerro lähteiden käyttötarkoitus ja olennaiset rajat. Lähdemäärä tai sanamäärä
    ei ole tavoite, jota varten lisätään sisältöä.
  expected_output: >
    {report_task_deliverable}
    Selkeä raportti kielellä {language}, yleensä 300–500 sanaa lähteiden lisäksi.
    Lyhyempi vastaus riittää niukalla aineistolla. Lähteistetyt perustelut,
    ehdollinen päätelmä ja tiedon puutteet. Ei uusia tulkintoja analyysin rinnalle.
