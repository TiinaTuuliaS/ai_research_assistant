competition:
  research_task: >
    Etsi aiheeseen sopivat nimetyt vaihtoehdot oikealta alueelta sekä olennaiset
    vertailukohteet muualla. Selvitä mitä asiakas saa, kenelle tarjonta sopii,
    saatavuus ja ilmoitettu hinta. Sovita vertailuperusteet toimialaan.
    Suosi toimijoiden alkuperäisiä palvelu-, tuote- ja hinnastosivuja.
    Etsi myös dokumentoituja muutoksia tarjonnassa ja valintaperusteissa.
    Tuntematon tieto jää tuntemattomaksi; tuotejulkaisu ei osoita suosiota.
  analysis_task: >
    Vertaa nimettyjen vaihtoehtojen tarjontaa käyttäjän kysymyksen ja kriteerien perusteella.
    Arvioi käyttäjän oman suunnitelman erottumista vain, jos käyttäjä pyytää sitä.
    Täytä comparisons vain lähteillä tuetuista vertailukohteista. Kerro
    konkreettinen ominaisuus ja onko se yhteinen, osoitettu ero, testattava
    ehdotus vai tuntematon. Puuttuva tieto ei osoita kilpailijan puutetta.
    Kilpailijan jo tarjoama ominaisuus ei itsessään erotu siitä. Ero yhteen
    kilpailijaan ei osoita markkinanlaajuista ainutlaatuisuutta.
    Suosittele suuntaa aineiston sallimissa rajoissa; myös valinnan lykkääminen on sallittua.
    Asiakashyöty on oletus ilman suoraa näyttöä; älä keksi parempaa laatua tai hintaa.
  report_task: >
    Vastaa käyttäjän vertailukysymykseen. Käsittele oman ratkaisun erottumista
    vain, jos käyttäjä pyytää sitä.
    Käytä otsikoita "Vastaus kysymykseesi", "Tarjonnan vertailu",
    "Näytön vahvuus ja puutteet", "Johtopäätös" ja "Lähteet".
    Säilytä ero yhteisen ominaisuuden, osoitetun eron ja testattavan ehdotuksen
    välillä. Nimeä vertailtavat toimijat. Jos esität ehdotuksen, kerro sen haittapuoli.
    Käsittele ajallista kehitystä vain, jos se auttaa vastaamaan kysymykseen.
market:
  research_task: >
    Kokoa kysymyksen kannalta olennaiset toimijat ja markkinahavainnot.
    Etsi ajoitettua vertailutietoa sekä kansainvälisiä kehityssuuntia.
    Erota nykytila, todennettu muutos ja ennuste. Ilman vertailukelpoisia
    aikahavaintoja älä väitä kasvua. Säilytä lähteen alue ja ajanjakso;
    toisen maan kehitys ei ole paikallinen tosiasia. Älä keksi markkinan kokoa.
  analysis_task: >
    Vastaa käyttäjän markkinakysymykseen: mitä aineisto osoittaa nykytilasta,
    mikä muutos voidaan perustella ja mikä jää epävarmaksi. Kerro vaikutus
    käyttäjän omaan kysymykseen. Älä oleta hänen perustavan yritystä,
    etsivän työtä tai kehittävän ohjelmistoa, ellei hän ole sitä kertonut.
    Suositus voi olla seurattava asia, jos käyttäjä pyytää vain tilannekuvaa.
    Nimeä vaihtoehtoinen tulkinta ja ratkaiseva epävarmuus. comparisons on tyhjä lista.
  report_task: >
    Vastaa käyttäjän markkinakysymykseen löydetyn aineiston rajoissa.
    Käytä otsikoita "Vastaus kysymykseesi", "Olennaiset havainnot",
    "Näytön vahvuus ja puutteet", "Merkitys käyttäjälle" ja "Lähteet".
    Erota nykytila, todennetut muutokset ja mahdolliset tulevat kehityskulut.
    Älä käsittele kysymystä automaattisesti uuden tuotteen kysynnän arviointina.
